name: DiHiggs Modular CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------------------
  # JOB 1: BUILD CORE (Construye Binarios e Imagen Docker)
  # ----------------------------------------------------------------
  build_core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necesario para SUBIR la imagen al registro (cache)

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # FIX 1: Autenticación explícita en el registro de contenedores
      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # FIX 2: push: 'true' (como string)
      - name: 🐳 Build Core in DevContainer
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          imageName: ghcr.io/${{ github.repository }}/devcontainer-image
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer-image
          push: 'true' 
          runCmd: bash .github/scripts/ci_build_core.sh

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-binaries
          path: |
            dihiggs/lib/libdihiggs.a
            tests/unit/dihiggs_unit_tests
          retention-days: 1

  # ----------------------------------------------------------------
  # JOB 2: TEST MATRIX (Ejecución Paralela)
  # ----------------------------------------------------------------
  run_tests:
    needs: build_core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # Necesario para BAJAR la imagen del registro

    strategy:
      fail-fast: false
      matrix:
        test-suite: [unit, oracle]

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # FIX 1: Autenticación también necesaria aquí para bajar la imagen cacheada
      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Download Binaries
        uses: actions/download-artifact@v4
        with:
          name: compiled-binaries

      - name: 🔧 Fix Permissions
        run: |
          chmod +x tests/unit/dihiggs_unit_tests

      # FIX 2: push: 'never' (como string)
      - name: 🚀 Run ${{ matrix.test-suite }} Tests
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer-image
          push: 'never'
          runCmd: bash .github/scripts/ci_run_tests.sh ${{ matrix.test-suite }}