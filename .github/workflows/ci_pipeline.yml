name: DiHiggs Modular CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# Permisos globales para interactuar con GHCR
permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------
  # JOB 1: BUILD CORE
  # ----------------------------------------------------------------
  build_core:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build Core & Push Cache
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          imageName: ghcr.io/${{ github.repository }}/devcontainer-image
          push: always
          runCmd: bash .github/scripts/ci_build_core.sh

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-binaries
          path: |
            dihiggs/lib/libdihiggs.a
            dihiggs/app/PhysLam1Scan
            tests/unit/dihiggs_unit_tests
          retention-days: 1

  docs_build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: 📦 Install Docs Dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: 🧱 Build Sphinx HTML (warnings as errors)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m sphinx -b html -W docs docs/_build/html

  # ----------------------------------------------------------------
  # JOB 2: TEST MATRIX
  # ----------------------------------------------------------------
  run_tests:
    needs: build_core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-suite: [unit, oracle]

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- VERIFICACIÓN DE CACHÉ ---
      - name: 🕵️ Check Cache Status
        run: |
          echo "Verificando si la imagen existe en el registro..."
          docker pull ghcr.io/${{ github.repository }}/devcontainer-image:latest || echo "⚠️ Cache no encontrado aún. Se construirá de cero en este step."

      - name: 📥 Download Binaries
        uses: actions/download-artifact@v4
        with:
          name: compiled-binaries

      - name: 🔧 Fix Permissions
        run: chmod +x tests/unit/dihiggs_unit_tests

      - name: 🚀 Run ${{ matrix.test-suite }} Tests
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          imageName: ghcr.io/${{ github.repository }}/devcontainer-image
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer-image
          push: never
          runCmd: bash .github/scripts/ci_run_tests.sh ${{ matrix.test-suite }}
