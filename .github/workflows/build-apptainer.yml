name: Build HPC Container

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      # Exportamos el tag exacto para usarlo en el siguiente job
      version_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-apptainer:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: '1.3.0'

      - name: Login to GHCR (Apptainer)
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | apptainer remote login -u ${{ github.actor }} --password-stdin docker://${{ env.REGISTRY }}

      - name: Patch Apptainer Definition for CI
        # ESTE PASO ES LA CLAVE: Cambia local (tar) a remoto (docker://)
        run: |
          # 1. Cambiar el agente de Bootstrap de 'docker-archive' a 'docker'
          sed -i 's/Bootstrap: docker-archive/Bootstrap: docker/' apptainer.def
          
          # 2. Definir la imagen exacta que acabamos de construir
          # Reemplazamos la linea 'From: ...' completa
          DOCKER_FULL_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          sed -i "s|From: dihiggs-base.tar|From: $DOCKER_FULL_REF|" apptainer.def
          
          echo "--- Contenido del apptainer.def parcheado ---"
          cat apptainer.def

      - name: Build SIF
        run: |
          # Usamos --fakeroot para evitar el error de privilegios en GitHub Runners
          apptainer build --fakeroot dihiggs.sif apptainer.def

      - name: Upload SIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: dihiggs-hpc-image
          path: dihiggs.sif
          retention-days: 5