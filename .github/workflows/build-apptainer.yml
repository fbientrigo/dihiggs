name: Build HPC Container

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # TRABAJO 1: Construir la imagen base Docker y subirla al registry
  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # TRABAJO 2: Convertir esa imagen Docker a Apptainer (.sif) y guardar el artifact
  build-apptainer:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch Apptainer Definition
        # Modificamos el archivo .def para que apunte a la imagen Docker que acabamos de crear
        run: |
          # 1. Cambiar agente a 'docker'
          sed -i 's/Bootstrap: docker-archive/Bootstrap: docker/' apptainer.def
          
          # 2. Inyectar la URL exacta de la imagen del registry
          DOCKER_FULL_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          sed -i "s|From: dihiggs-base.tar|From: $DOCKER_FULL_REF|" apptainer.def
          
          echo "--- apptainer.def final ---"
          cat apptainer.def

      - name: Build SIF via Docker (Privileged)
        # SOLUCIÓN INVESTIGADA:
        # Usamos 'kaczmarj/apptainer', que es la imagen estándar de la comunidad
        # para correr Apptainer dentro de Docker en CI.
        # Se aloja en Docker Hub, evitando los problemas de auth de quay.io.
        run: |
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            kaczmarj/apptainer:latest \
            bash -c "
              # Paso A: Login en GHCR (dentro del contenedor)
              # Apptainer necesita credenciales para bajar tu imagen base docker://
              apptainer remote login -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} docker://${{ env.REGISTRY }}
              
              # Paso B: Construir
              # Construimos el .sif usando la definición parcheada
              apptainer build dihiggs.sif apptainer.def
            "
      - name: Upload SIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: dihiggs-hpc-image
          path: dihiggs.sif
          retention-days: 5