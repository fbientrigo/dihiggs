name: Python guards

# Lightweight, dependency-free guards that the docker-based ci_pipeline.yml
# (C++ unit/oracle suites only) does not cover. Runs on push/PR so drift in the
# shared physics conventions or the external-tool version manifest fails here
# instead of only when someone runs pytest by hand.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  clean-lambda1-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgsl-dev
      - run: make -C 2hdmc
      - run: bash scripts/build_lambda1_characterization.sh
      - run: make -C dihiggs app/Lambda1EvaluatorV2
      - run: make -C dihiggs app/DihiggsPointV2Evaluator
      - run: make -C dihiggs app/Phys_M2BandTracker
      - run: python -m pip install pytest "PyYAML>=5.0"
      - run: >-
          python -m pytest -q
          tests/test_golden_lambda1.py
          tests/test_dihiggs_point_v2.py
          tests/test_m2_tracker_intervals.py
          tests/test_orchestrator
          tests/test_proposal_batch.py
        env:
          DIHIGGS_REQUIRE_LAMBDA1_BINARY: "1"

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest "PyYAML>=5.0"

      - name: Run convention / external-tool drift guards
        run: |
          pytest -q \
            tests/test_physics_conventions.py \
            tests/test_external_tools.py
